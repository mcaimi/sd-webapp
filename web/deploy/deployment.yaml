apiVersion: apps/v1
kind: Deployment
metadata:
  name: sd-webapp-web
spec:
  replicas: 2
  selector:
    matchLabels: {}
  template:
    spec:
      containers:
        - name: web
          image: sd-webapp-web
          ports:
            - name: http
              containerPort: 8080
          env:
            # In-cluster Service of the backend; scheme://host:port, no path.
            - name: SD_API_URL
              value: http://sd-api-backend:8000
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
